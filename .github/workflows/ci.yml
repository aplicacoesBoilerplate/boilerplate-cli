name: CI
on:
  workflow_call:
  push:
    branches: [master, develop, 'release/**']
  pull_request:
    branches: [master, develop, 'release/**', 'feature/issue-8']
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, milestoned, demilestoned]
permissions:
  contents: read
jobs:
  go-ci:
    if: ${{ github.event_name != 'pull_request_review' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merged == true && github.event.pull_request.merge_commit_sha || github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
      - run: go test ./...
      - run: go vet ./...
      - run: go build -o boilerplate .
      - run: ./boilerplate --help
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar dependência dos testes de contrato
        run: python -m pip install PyYAML==6.0.1
      - name: Validar contrato do caller de versionamento
        run: python tests/versioning/test_caller.py
      - name: Validar Conventional Commits do PR
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base=$(git merge-base "origin/$BASE_REF" HEAD)
          while IFS= read -r commit; do
            git show -s --format=%B "$commit" | bash scripts/validate-commit-msg.sh -
          done < <(git rev-list --no-merges "$base..HEAD")

